<script>
  // rasterise each mark at a true 16px and blow the pixels up, so the tab icon can be judged
  document.querySelectorAll('canvas.zoom').forEach(c => {
    const dark = c.closest('.dark');
    const src = document.getElementById(c.dataset.svg).innerHTML
      .replace(/currentColor/g, dark ? '#F4F5F5' : '#0B0C0D');
    const img = new Image();
    img.onload = () => c.getContext('2d').drawImage(img, 0, 0, 16, 16);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(src);
  });
</script>
